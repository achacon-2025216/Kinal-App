<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kinal App - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
<div class="container py-5">
    <header class="text-center mb-5">
        <h1 class="display-4 fw-bold text-primary">Sistema de Gestión Kinal</h1>
        <p class="lead">Bienvenido, <span th:text="${session.usuarioLogueado}">Usuario</span> (<span th:text="${session.rol}">ROL</span>)</p>
        <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
    </header>

    <div class="row g-4 justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <h3>Clientes</h3>
                    <a th:href="@{/clientes}" class="btn btn-primary w-100">Ir a Clientes</a>
                </div>
            </div>
        </div>

        <div class="col-md-4" th:if="${session.rol == 'ADMIN'}">
            <div class="card shadow-sm h-100 border-warning">
                <div class="card-body text-center">
                    <h3>Usuarios</h3>
                    <p class="small text-danger">Acceso Restringido</p>
                    <a th:href="@{/usuarios}" class="btn btn-warning w-100">Configurar Usuarios</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <h3>Venta</h3>
                    <a th:href="@{/ventas}" class="btn btn-primary w-100">Gestionar Ventas</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <h3>Producto</h3>
                    <a th:href="@{/productos}" class="btn btn-primary w-100">Gestionar Productos</a>
                </div>
            </div>
        </div>

        <div class="col-md-4" th:if="${session.rol == 'ADMIN'}">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <h3>Detalle Venta</h3>
                    <a th:href="@{/detalles}" class="btn btn-secondary w-100">Configurar Detalles</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
