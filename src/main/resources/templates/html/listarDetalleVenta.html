<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Kinal App - Detalles de Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <header class="text-center mb-5">
        <h1 style="color: #141A3D; font-weight: 700;">Detalles de Facturación</h1>
        <p class="text-muted">Gestión de artículos y buscador de inventario</p>
    </header>

    <div class="row g-4">
        <!-- COLUMNA FORMULARIO: Ahora visible para ADMIN y USER -->
        <!-- Usamos hasAnyRole para que el usuario normal también pueda agregar ítems -->
        <div class="col-md-4" sec:authorize="hasAnyRole('ADMIN', 'USER')">
            <div class="card border-0 shadow-sm p-4" style="border-radius: 15px;">
                <!-- El título cambia solo si es ADMIN editando, el USER siempre verá "Agregar" -->
                <h4 class="mb-4" style="color: #141A3D;"
                    th:text="${detalleNuevo.codigoDetalleVenta != null} ? 'Editar Item' : 'Agregar Item'">
                </h4>

                <form th:action="@{/detalles/guardar}" th:object="${detalleNuevo}" method="post">
                    <input type="hidden" th:field="*{codigoDetalleVenta}">

                    <div class="mb-3">
                        <label class="form-label fw-bold">Seleccionar Venta (Factura)</label>
                        <select th:field="*{venta.codigoVenta}" class="form-select" required>
                            <option value="" disabled selected>--- Seleccione Venta ---</option>
                            <option th:each="v : ${listaVentas}"
                                    th:value="${v.codigoVenta}"
                                    th:text="'Factura #' + ${v.codigoVenta} + ' - ' + ${v.cliente?.nombreCliente ?: 'Cliente no asignado'}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Producto</label>
                        <select th:field="*{producto.codigoProducto}" class="form-select" required>
                            <option value="" disabled selected>--- Seleccione Producto ---</option>
                            <option th:each="p : ${listaProductos}"
                                    th:value="${p.codigoProducto}"
                                    th:text="${p.nombreProducto} + ' (Stock: ' + ${p.stock} + ')'"></option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold">Cantidad</label>
                            <input type="number" th:field="*{cantidad}" class="form-control" required min="1">
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold">Precio U.</label>
                            <input type="text" class="form-control bg-light" placeholder="Auto" readonly>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-3">
                        <button type="submit" class="btn text-white" style="background-color: #141A3D;">
                            <i class="bi bi-cart-plus"></i>
                            <span th:text="${detalleNuevo.codigoDetalleVenta != null} ? ' Actualizar' : ' Agregar'"></span>
                        </button>
                        <!-- Botón cancelar solo si hay algo editándose (ADMIN) -->
                        <a th:href="@{/detalles}" class="btn btn-secondary" th:if="${detalleNuevo.codigoDetalleVenta != null}">Cancelar</a>
                        <a th:href="@{/}" class="btn btn-outline-secondary">Regresar</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- COLUMNA TABLA -->
        <div class="col-md-8">
            <div class="card border-0 shadow-sm p-4" style="border-radius: 15px;">

                <!-- BUSCADOR -->
                <div class="row mb-4">
                    <div class="col-12">
                        <form th:action="@{/detalles/buscar}" method="get" class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                            <input type="text" name="termino" class="form-control border-start-0"
                                   placeholder="Buscar factura o producto..." required>
                            <button class="btn btn-dark" type="submit">Buscar</button>
                            <a th:href="@{/detalles}" class="btn btn-outline-secondary">Limpiar</a>
                        </form>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead style="background-color: #141A3D; color: white;">
                        <tr>
                            <th>Factura</th>
                            <th>Producto</th>
                            <th class="text-center">Cant.</th>
                            <th>Precio U.</th>
                            <th>Subtotal</th>
                            <!-- Solo mostramos el encabezado de acciones si es ADMIN -->
                            <th sec:authorize="hasRole('ADMIN')" class="text-center">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="d : ${listaDetalles}">
                            <td th:text="'#' + ${d.venta.codigoVenta}"></td>
                            <td class="fw-bold" th:text="${d.producto.nombreProducto}"></td>
                            <td class="text-center" th:text="${d.cantidad}"></td>
                            <td th:text="'Q' + ${#numbers.formatDecimal(d.precioUnitario, 1, 2)}"></td>
                            <td class="fw-bold text-success" th:text="'Q' + ${#numbers.formatDecimal(d.subtotal, 1, 2)}"></td>

                            <!-- ACCIONES: Estrictamente solo para ADMIN -->
                            <td sec:authorize="hasRole('ADMIN')" class="text-center">
                                <a th:href="@{/detalles/editar/{id}(id=${d.codigoDetalleVenta})}"
                                   class="btn btn-sm btn-outline-warning"><i class="bi bi-pencil"></i></a>
                                <a th:href="@{/detalles/eliminar/{id}(id=${d.codigoDetalleVenta})}"
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('¿Eliminar item?')"><i class="bi bi-trash"></i></a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div th:if="${#lists.isEmpty(listaDetalles)}" class="alert alert-info text-center mt-3 border-0">
                    <i class="bi bi-info-circle me-2"></i> No se encontraron resultados.
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
