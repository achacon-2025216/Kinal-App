<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #141A3D;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .card-registro {
            background: white;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
<div class="card-registro">
    <div class="text-center mb-4">
        <h2 style="color: #141A3D; font-weight: 700;">REGISTRO</h2>
        <p class="text-muted">Crea tu cuenta de usuario</p>
    </div>

    <form th:action="@{/registro/guardar}" th:object="${usuarioNuevo}" method="post">
        <div class="mb-3">
            <label class="form-label">Nombre de Usuario</label>
            <input type="text" th:field="*{username}" class="form-control" placeholder="Usuario" required>
        </div>
        <div class="mb-4">
            <label class="form-label">Contraseña</label>
            <input type="password" th:field="*{password}" class="form-control" placeholder="Contraseña" required>
        </div>
        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Crear Cuenta</button>
            <a th:href="@{/login}" class="text-center mt-2 text-decoration-none text-muted small">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </form>
</div>
</body>
</html>
