<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Kinal App - Inventario de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --kinal-dark: #141A3D; }
        .btn-kinal { background-color: var(--kinal-dark); color: white; }
        .btn-kinal:hover { background-color: #0d122b; color: white; }
        .card { border-radius: 15px; border: none; }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <header class="text-center mb-5">
        <h1 class="display-5 fw-bold" style="color: #141A3D;">Gestión de Productos</h1>
        <p class="text-muted">Control de stock e inventario - Kinal App</p>
    </header>

    <!-- BARRA DE BÚSQUEDA -->
    <div class="card shadow-sm p-3 mb-4">
        <form th:action="@{/productos/buscar}" method="get" class="row g-3 align-items-center">
            <div class="col-auto">
                <label class="fw-bold"><i class="bi bi-search"></i> Buscar:</label>
            </div>
            <div class="col-md-6">
                <input type="text" name="termino" class="form-control" placeholder="Nombre del producto..." required>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-kinal">Filtrar</button>
                <a th:href="@{/productos}" class="btn btn-outline-secondary">Limpiar</a>
            </div>
        </form>
    </div>

    <div class="row g-4">
        <!-- FORMULARIO: Accesible para ADMIN y USER -->
        <div class="col-lg-4" sec:authorize="hasAnyRole('ADMIN', 'USER')">
            <div class="card shadow-sm p-4">
                <h3 class="mb-4" style="color: #141A3D;"
                    th:text="${productoEditando.codigoProducto != null} ? 'Editar Producto' : 'Registrar Producto'">
                </h3>

                <form th:action="@{/productos/guardar}" th:object="${productoEditando}" method="post">
                    <input type="hidden" th:field="*{codigoProducto}">
                    <input type="hidden" th:field="*{estado}">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre del Producto</label>
                        <input type="text" th:field="*{nombreProducto}" class="form-control" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Precio (Q)</label>
                            <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Stock Inicial</label>
                            <input type="number" th:field="*{stock}" class="form-control" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-kinal">
                            <i class="bi bi-cloud-arrow-up"></i>
                            <span th:text="${productoEditando.codigoProducto != null} ? ' Actualizar Datos' : ' Guardar Producto'"></span>
                        </button>
                        <a th:href="@{/}" class="btn btn-outline-dark mt-2"><i class="bi bi-house-door"></i> Inicio</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- TABLA DE INVENTARIO -->
        <div class="col-lg-8">
            <div class="card shadow-sm p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                        <tr>
                            <th>Código</th>
                            <th>Descripción</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th class="text-center" sec:authorize="hasRole('ADMIN')">Gestión</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${listaProductos}">
                            <td th:text="${p.codigoProducto}"></td>
                            <td class="fw-bold" th:text="${p.nombreProducto}"></td>
                            <td th:text="'Q' + ${#numbers.formatDecimal(p.precio, 1, 2)}"></td>
                            <td>
                                <span th:class="${p.stock <= 10} ? 'badge bg-danger' : 'badge bg-success'" th:text="${p.stock}"></span>
                            </td>
                            <td class="text-center" sec:authorize="hasRole('ADMIN')">
                                <a th:href="@{/productos/editar/{id}(id=${p.codigoProducto})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                                <a th:href="@{/productos/eliminar/{id}(id=${p.codigoProducto})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar?')"><i class="bi bi-trash"></i></a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
