<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Kinal App - Inventario de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/listarProducto.css}">
</head>
<body>

<div class="container py-5">
    <header class="text-center mb-5">
        <h1 class="display-5 fw-bold" style="color: #141A3D;">Gestión de Productos</h1>
        <p class="text-muted">Control de stock e inventario - Kinal App</p>
    </header>

    <div class="row g-4">
        <!-- BLOQUEO 1: El formulario solo es visible para ADMIN -->
        <div class="col-lg-4" sec:authorize="hasRole('ADMIN')">
            <div class="card border-0 shadow-sm p-4 form-card">
                <h3 class="mb-4" style="color: #141A3D;"
                    th:text="${productoEditando.codigoProducto != null} ? 'Editar Producto' : 'Nuevo Producto'">
                    Nuevo Producto
                </h3>

                <form th:action="@{/productos/guardar}" th:object="${productoEditando}" method="post">

                    <input type="hidden" th:field="*{codigoProducto}">

                    <div class="mb-3" th:if="${productoEditando.codigoProducto == null}">
                        <label class="form-label fw-semibold">Código</label>
                        <input type="number" th:field="*{codigoProducto}" class="form-control" placeholder="ID del producto" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre del Producto</label>
                        <input type="text" th:field="*{nombreProducto}" class="form-control" placeholder="Ej. Jugos" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Precio (Q)</label>
                            <input type="number" step="0.01" th:field="*{precio}" class="form-control" placeholder="0.00" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Stock</label>
                            <input type="number" th:field="*{stock}" class="form-control" placeholder="Cant." required>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-3">
                        <button type="submit" class="btn btn-save btn-primary">
                            <i class="bi bi-save"></i>
                            <span th:text="${productoEditando.codigoProducto != null} ? ' Actualizar' : ' Guardar'"></span>
                        </button>

                        <a th:href="@{/productos}" class="btn btn-light border" th:if="${productoEditando.codigoProducto != null}">
                            Cancelar
                        </a>

                        <a th:href="@{/}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Volver al Inicio
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Ajuste de columna: col-lg-8 si hay form (admin), col-lg-12 si no lo hay (user) -->
        <div th:class="${#authorization.expression('hasRole(''ADMIN'')')} ? 'col-lg-8' : 'col-lg-12'">
            <div class="card border-0 shadow-sm p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 style="color: #141A3D; margin: 0;">Inventario Actual</h3>
                    <!-- Botón volver visible para USER (ya que el del form desaparece) -->
                    <a th:href="@{/}" class="btn btn-sm btn-outline-secondary" sec:authorize="hasRole('USER')">
                        <i class="bi bi-arrow-left"></i> Menú Principal
                    </a>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <!-- BLOQUEO 2: Encabezado de acciones solo para ADMIN -->
                            <th class="text-center" sec:authorize="hasRole('ADMIN')">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${listaProductos}">
                            <td th:text="${p.codigoProducto}"></td>
                            <td class="fw-bold" th:text="${p.nombreProducto}"></td>
                            <td th:text="'Q' + ${p.precio}"></td>
                            <td>
                                <span th:class="${p.stock < 10} ? 'badge bg-danger' : 'badge bg-success'"
                                      th:text="${p.stock}"></span>
                            </td>
                            <!-- BLOQUEO 3: Botones de editar/eliminar solo para ADMIN -->
                            <td class="text-center" sec:authorize="hasRole('ADMIN')">
                                <a th:href="@{/productos/editar/{id}(id=${p.codigoProducto})}"
                                   class="btn btn-outline-warning btn-sm me-1">
                                    <i class="bi bi-pencil-square"></i>
                                </a>

                                <a th:href="@{/productos/eliminar/{id}(id=${p.codigoProducto})}"
                                   class="btn btn-outline-danger btn-sm"
                                   onclick="return confirm('¿Eliminar este producto?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
