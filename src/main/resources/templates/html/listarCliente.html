<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Clientes - Kinal</title>
    <link rel="stylesheet" th:href="@{/css/listarCliente.css}">
</head>
<body>

<div class="container">
    <h2>Gestión de Clientes - Kinal</h2>

    <div class="card-formulario">
        <h3 th:text="${clienteEditando?.dpiCliente != null} ? 'Editar Cliente' : 'Nuevo Cliente'"></h3>

        <form th:action="@{/clientes/guardar}" th:object="${clienteEditando}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>DPI:</label>
                    <input type="text" th:field="*{dpiCliente}"
                           th:readonly="${clienteEditando?.dpiCliente != null}"
                           class="form-control" required />
                </div>

                <div class="form-group">
                    <label>Nombre:</label>
                    <input type="text" th:field="*{nombreCliente}" class="form-control" required />
                </div>

                <div class="form-group">
                    <label>Apellido:</label>
                    <input type="text" th:field="*{apellidoCliente}" class="form-control" required />
                </div>

                <div class="form-group">
                    <label>Dirección:</label>
                    <input type="text" th:field="*{direccion}" class="form-control" required />
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-nuevo">
                        <span th:text="${clienteEditando?.dpiCliente != null} ? 'Actualizar' : 'Guardar'"></span>
                    </button>

                    <a th:if="${clienteEditando?.dpiCliente != null}"
                       th:href="@{/clientes}"
                       class="btn btn-eliminar">Cancelar</a>
                </div>
            </div>

            <hr>

            <div style="text-align: center;">
                <a th:href="@{/}" class="btn btn-editar">← Volver al Inicio de la App</a>
            </div>
        </form>
    </div>

    <table class="tabla-clientes">
        <thead>
        <tr>
            <th>DPI</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Dirección</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cliente : ${listaClientes}">
            <td th:text="${cliente.dpiCliente}"></td>
            <td th:text="${cliente.nombreCliente}"></td>
            <td th:text="${cliente.apellidoCliente}"></td>
            <td th:text="${cliente.direccion}"></td>
            <td>
                <a th:href="@{/clientes/editar/{id}(id=${cliente.dpiCliente})}" class="btn btn-editar">Editar</a>
                <a th:href="@{/clientes/eliminar/{id}(id=${cliente.dpiCliente})}" class="btn btn-eliminar">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
