<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Clientes - Kinal</title>
    <link rel="stylesheet" th:href="@{/css/listarCliente.css}">
</head>
<body>

<div class="container">
    <h2>Gestión de Clientes - Kinal</h2>

    <!-- SECCIÓN DE BÚSQUEDA: Ahora disponible para USER y ADMIN -->
    <div class="search-container" sec:authorize="hasAnyRole('USER', 'ADMIN')" style="margin-bottom: 20px; background: #f4f4f4; padding: 15px; border-radius: 8px;">
        <form th:action="@{/clientes/buscar}" method="get" style="display: flex; gap: 10px; align-items: center;">
            <label><strong>Buscar Cliente:</strong></label>
            <input type="text" name="termino" placeholder="Ingrese nombre o DPI..." class="form-control" style="width: 250px;">
            <button type="submit" class="btn btn-nuevo">🔍 Buscar</button>
            <a th:href="@{/clientes}" class="btn btn-editar">Limpiar</a>
        </form>
    </div>

    <!-- FORMULARIO PARA AGREGAR/EDITAR -->
    <div class="card-formulario" sec:authorize="hasAnyRole('USER', 'ADMIN')">
        <h3 th:text="${clienteEditando?.dpiCliente != null} ? 'Editar Cliente' : 'Nuevo Cliente'"></h3>

        <form th:action="@{/clientes/guardar}" th:object="${clienteEditando}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>DPI:</label>
                    <input type="text" th:field="*{dpiCliente}"
                           th:readonly="${clienteEditando?.dpiCliente != null}"
                           class="form-control" required />
                </div>
                <div class="form-group">
                    <label>Nombre:</label>
                    <input type="text" th:field="*{nombreCliente}" class="form-control" required />
                </div>
                <div class="form-group">
                    <label>Apellido:</label>
                    <input type="text" th:field="*{apellidoCliente}" class="form-control" required />
                </div>
                <div class="form-group">
                    <label>Dirección:</label>
                    <input type="text" th:field="*{direccion}" class="form-control" required />
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-nuevo">
                        <span th:text="${clienteEditando?.dpiCliente != null} ? 'Actualizar' : 'Guardar'"></span>
                    </button>
                    <a th:if="${clienteEditando?.dpiCliente != null}" th:href="@{/clientes}" class="btn btn-eliminar">Cancelar</a>
                </div>
            </div>
        </form>
    </div>

    <table class="tabla-clientes">
        <thead>
        <tr>
            <th>DPI</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Dirección</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cliente : ${listaClientes}">
            <td th:text="${cliente.dpiCliente}"></td>
            <td th:text="${cliente.nombreCliente}"></td>
            <td th:text="${cliente.apellidoCliente}"></td>
            <td th:text="${cliente.direccion}"></td>
            <td>
                <!-- CORRECCIÓN: Usar hasRole para ADMIN y un span diferente para USER -->
                <div sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/clientes/editar/{id}(id=${cliente.dpiCliente})}" class="btn btn-editar">Editar</a>
                    <a th:href="@{/clientes/eliminar/{id}(id=${cliente.dpiCliente})}" class="btn btn-eliminar">Eliminar</a>
                </div>
                <div sec:authorize="hasRole('USER')">
                    <span style="color: gray; font-style: italic;">Lectura (Usuario)</span>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <div style="text-align: center; margin-top: 20px;">
        <a th:href="@{/}" class="btn btn-editar">← Volver al Inicio de la App</a>
    </div>
</div>
</body>
</html>
