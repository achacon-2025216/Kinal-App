<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URBN KICKS - Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/login_registro.css}">
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">

            <div class="card-custom">
                <div class="text-center mb-4">
                    <div class="mb-2">
                        <i class="bi bi-shield-lock" style="font-size: 2.5rem; color: #141A3D;"></i>
                    </div>
                    <h2 class="brand-title">URBN KICKS</h2>
                    <p class="text-muted small">Panel de Administración Kinal App</p>
                </div>

                <div th:if="${error}" class="alert alert-danger d-flex align-items-center" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <div th:text="${error}"></div>
                </div>

                <div th:if="${mensajeExito}" class="alert alert-success d-flex align-items-center" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <div th:text="${mensajeExito}"></div>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control border-start-0" placeholder="Ingresa tu usuario" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-key"></i></span>
                            <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary-custom">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                        </button>
                    </div>
                </form>

                <hr class="my-4 text-muted">

                <div class="text-center">
                    <p class="small text-muted mb-1">¿Aún no tienes acceso?</p>
                    <a th:href="@{/registro}" class="link-custom fw-bold">
                        Crea una cuenta de administrador
                    </a>
                </div>
            </div>

            <div class="text-center mt-4">
                <p class="text-white-50 small">© 2026 URBN KICKS - Fundación Kinal</p>
            </div>

        </div>
    </div>
</div>

</body>
</html>
