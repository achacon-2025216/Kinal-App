<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #141A3D; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-login { background: white; padding: 2.5rem; border-radius: 1rem; width: 100%; max-width: 400px; }
    </style>
</head>
<body>
<div class="card-login">
    <div class="text-center mb-4">
        <h2 style="color: #141A3D; font-weight: 700;">BIENVENIDO</h2>
    </div>

    <form th:action="@{/login/entrar}" method="post">
        <div th:if="${param.error}" class="alert alert-danger p-2 text-center small">
            Credenciales incorrectas
        </div>
        <div class="mb-3">
            <input type="text" name="username" class="form-control" placeholder="Usuario" required>
        </div>
        <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
        </div>
        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            <a th:href="@{/registro}" class="text-center mt-2 text-decoration-none text-muted small">Regístrate aquí</a>
        </div>
    </form>
</div>
</body>
</html>
