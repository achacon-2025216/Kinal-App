<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kinal App - Gestión de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/listarVenta.css}">
</head>
<body>

<div class="container py-5">
    <header class="text-center mb-5">
        <h1 style="color: #141A3D; font-weight: 700;">Gestión de Ventas</h1>
        <p class="text-muted">Registro de transacciones comerciales - Fundación Kinal</p>
    </header>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 p-4" style="border-radius: 15px;">
                <h2 style="color: #141A3D; font-size: 1.5rem;" class="mb-4">Nueva Venta</h2>

                <form th:action="@{/ventas/guardar}" th:object="${ventaEditando}" method="post">

                    <div class="mb-3">
                        <label class="form-label fw-bold">Código Venta</label>
                        <input type="number" th:field="*{codigoVenta}" class="form-control" placeholder="ID Venta" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Fecha</label>
                        <input type="date" th:field="*{fechaVenta}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Total (Q)</label>
                        <input type="number" step="0.01" th:field="*{total}" class="form-control" placeholder="0.00" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Cliente</label>
                        <select th:field="*{cliente.dpiCliente}" class="form-select" required>
                            <option value="" disabled selected>--- Seleccione Cliente ---</option>
                            <option th:each="c : ${listaClientes}"
                                    th:value="${c.dpiCliente}"
                                    th:text="${c.nombreCliente}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Vendedor (Usuario)</label>
                        <select th:field="*{usuario.codigo}" class="form-select" required>
                            <option value="" disabled selected>--- Seleccione Vendedor ---</option>
                            <option th:each="u : ${listaUsuarios}"
                                    th:value="${u.codigo}"
                                    th:text="${u.username}"></option>
                        </select>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn text-white" style="background-color: #141A3D; border-radius: 8px;">
                            <i class="bi bi-cart-check"></i> Registrar Venta
                        </button>
                        <a th:href="@{/}" class="btn btn-light border mt-2">
                            <i class="bi bi-house"></i> Volver al Inicio
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm border-0 p-4" style="border-radius: 15px;">
                <h2 style="color: #141A3D; font-size: 1.5rem;" class="mb-4">Historial de Ventas</h2>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead style="background-color: #141A3D; color: white;">
                        <tr>
                            <th class="py-3 px-3" style="border-top-left-radius: 10px;">ID</th>
                            <th class="py-3">Fecha</th>
                            <th class="py-3">Cliente</th>
                            <th class="py-3">Total</th>
                            <th class="py-3 px-3" style="border-top-right-radius: 10px;">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="v : ${listaVentas}">
                            <td class="px-3" th:text="${v.codigoVenta}"></td>
                            <td th:text="${v.fechaVenta}"></td>
                            <td th:text="${v.cliente.nombreCliente}"></td>
                            <td class="fw-bold text-success" th:text="'Q' + ${v.total}"></td>
                            <td class="px-3">
                                <a th:href="@{/ventas/eliminar/{id}(id=${v.codigoVenta})}" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${#lists.isEmpty(listaVentas)}" class="alert alert-info text-center">
                    No hay ventas registradas actualmente.
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
