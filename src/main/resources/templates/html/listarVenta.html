<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Kinal App - Gestión de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; border: none; }
        .btn-kinal { background-color: #141A3D; color: white; }
        .btn-kinal:hover { background-color: #0d122b; color: white; }
    </style>
</head>
<body>

<div class="container py-5">
    <header class="text-center mb-5">
        <h1 style="color: #141A3D; font-weight: 700;">Gestión de Ventas</h1>
        <p class="text-muted">Registro de transacciones comerciales - Fundación Kinal</p>
    </header>

    <!-- BARRA DE BÚSQUEDA: Visible para todos -->
    <div class="card shadow-sm p-3 mb-4">
        <form th:action="@{/ventas/buscar}" method="get" class="row g-3 align-items-center">
            <div class="col-auto">
                <label class="fw-bold"><i class="bi bi-search"></i> Buscar Venta:</label>
            </div>
            <div class="col-md-5">
                <input type="text" name="termino" class="form-control" placeholder="Cliente o ID...">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-kinal">Filtrar</button>
                <a th:href="@{/ventas}" class="btn btn-outline-secondary">Limpiar</a>
            </div>
        </form>
    </div>

    <div class="row g-4">
        <!-- FORMULARIO: ADMIN y USER -->
        <div class="col-md-4" sec:authorize="hasAnyRole('ADMIN', 'USER')">
            <div class="card shadow-sm p-4">
                <h2 style="color: #141A3D; font-size: 1.2rem;" class="mb-4"
                    th:text="${ventaEditando.codigoVenta != null} ? 'Editar Venta' : 'Nueva Venta'"></h2>

                <form th:action="@{/ventas/guardar}" th:object="${ventaEditando}" method="post">
                    <input type="hidden" th:field="*{codigoVenta}">

                    <div class="mb-3">
                        <label class="form-label fw-bold">Fecha</label>
                        <input type="date" th:field="*{fechaVenta}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Total (Q)</label>
                        <input type="number" step="0.01" th:field="*{total}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Cliente</label>
                        <select th:field="*{cliente.dpiCliente}" class="form-select" required>
                            <option value="" disabled selected>--- Seleccione Cliente ---</option>
                            <option th:each="c : ${listaClientes}" th:value="${c.dpiCliente}" th:text="${c.nombreCliente}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Vendedor</label>
                        <select th:field="*{usuario.codigo}" class="form-select" required>
                            <option value="" disabled selected>--- Seleccione Vendedor ---</option>
                            <option th:each="u : ${listaUsuarios}" th:value="${u.codigo}" th:text="${u.username}"></option>
                        </select>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-kinal">
                            <i class="bi bi-save"></i>
                            <span th:text="${ventaEditando.codigoVenta != null} ? ' Actualizar' : ' Registrar'"></span>
                        </button>
                        <a th:href="@{/}" class="btn btn-outline-secondary">Inicio</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- TABLA DE HISTORIAL -->
        <div class="col-md-8">
            <div class="card shadow-sm p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Fecha</th>
                            <th>Cliente</th>
                            <th>Total</th>
                            <th class="text-center" sec:authorize="hasRole('ADMIN')">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="v : ${listaVentas}">
                            <td th:text="${v.codigoVenta}"></td>
                            <td th:text="${v.fechaVenta}"></td>
                            <td th:text="${v.cliente?.nombreCliente ?: 'N/A'}"></td>
                            <td class="fw-bold text-success" th:text="'Q' + ${v.total ?: '0.00'}"></td>
                            <td class="text-center" sec:authorize="hasRole('ADMIN')">
                                <a th:href="@{/ventas/editar/{id}(id=${v.codigoVenta})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                                <a th:href="@{/ventas/eliminar/{id}(id=${v.codigoVenta})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar?')"><i class="bi bi-trash"></i></a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
