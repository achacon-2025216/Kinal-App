<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kinal App - Gestión de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/listarVenta.css}">
</head>
<body>

<div class="main-container">
    <header class="text-center mb-5">
        <h1>Gestión de Ventas</h1>
        <p>Registro de transacciones comerciales</p>
    </header>

    <div class="row">
        <div class="col-md-4">
            <div class="card p-4">
                <h2>Nueva Venta</h2>
                <form th:action="@{/ventas/guardar}" th:object="${ventaEditando}" method="post">
                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold">Código Venta</label>
                        <input type="number" th:field="*{codigoVenta}" class="form-control" required>
                    </div>

                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold">Fecha</label>
                        <input type="date" th:field="*{fechaVenta}" class="form-control" required>
                    </div>

                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold">Total (Q)</label>
                        <input type="number" step="0.01" th:field="*{total}" class="form-control" placeholder="0.00" required>
                    </div>

                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold">Cliente</label>
                        <select th:field="*{cliente.dpiCliente}" class="form-select">
                            <option th:each="c : ${listaClientes}" th:value="${c.dpiCliente}" th:text="${c.nombreCliente}"></option>
                        </select>
                    </div>

                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold">Usuario (Vendedor)</label>
                        <select th:field="*{usuario.codigo}" class="form-select">
                            <option th:each="u : ${listaUsuarios}" th:value="${u.codigo}" th:text="${u.nombreUsuario}"></option>
                        </select>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn-index">
                            <i class="bi bi-cart-plus"></i> Registrar Venta
                        </button>
                        <a th:href="@{/}" class="text-muted text-decoration-none mt-2 small text-center">
                            <i class="bi bi-arrow-left"></i> Volver al Inicio
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card p-4">
                <h2>Historial</h2>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                        <tr style="background-color: #141A3D; color: white;">
                            <th>ID</th>
                            <th>Fecha</th>
                            <th>Cliente</th>
                            <th>Total</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="v : ${listaVentas}">
                            <td th:text="${v.codigoVenta}"></td>
                            <td th:text="${v.fechaVenta}"></td>
                            <td th:text="${v.cliente.nombreCliente}"></td>
                            <td th:text="'Q' + ${v.total}"></td>
                            <td>
                                <a th:href="@{/ventas/eliminar/{id}(id=${v.codigoVenta})}" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
