<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios - Kinal</title>
    <link rel="stylesheet" th:href="@{/css/listarUsuario.css}">
</head>
<body>

<div class="container">
    <h2>Gestión de Usuarios - Kinal</h2>

    <!-- CAMBIO 1: Ahora USER y ADMIN pueden ver el formulario para AGREGAR usuarios -->
    <div class="card-formulario" sec:authorize="hasAnyRole('USER', 'ADMIN')">
        <h3 th:text="${usuarioEditando.codigo != null} ? 'Editar Usuario' : 'Nuevo Usuario'"></h3>

        <form th:action="@{/usuarios/guardar}" th:object="${usuarioEditando}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>Código:</label>
                    <input type="number" th:field="*{codigo}"
                           th:readonly="${usuarioEditando.codigo != null}"
                           class="form-control" required />
                </div>

                <div class="form-group">
                    <label>Username:</label>
                    <input type="text" th:field="*{username}" class="form-control" required />
                </div>

                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" th:field="*{email}" class="form-control" required />
                </div>

                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" th:field="*{password}" class="form-control"
                           th:required="${usuarioEditando.codigo == null}"
                           placeholder="Contraseña" />
                </div>

                <div class="form-group">
                    <label>Rol:</label>
                    <!-- El USER puede crear otros USER, pero el ADMIN controla todo -->
                    <select th:field="*{rol}" class="form-control">
                        <option value="ROLE_USER">Usuario</option>
                        <option value="ROLE_ADMIN" sec:authorize="hasRole('ADMIN')">Administrador</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Estado:</label>
                    <select th:field="*{estado}" class="form-control">
                        <option value="1">Activo</option>
                        <option value="0">Inactivo</option>
                    </select>
                </div>

                <div class="form-group" style="margin-top: 20px;">
                    <button type="submit" class="btn btn-nuevo">
                        <span th:text="${usuarioEditando.codigo != null} ? 'Actualizar' : 'Guardar'"></span>
                    </button>
                    <a th:if="${usuarioEditando.codigo != null}" th:href="@{/usuarios}" class="btn btn-eliminar">Cancelar</a>
                </div>
            </div>
        </form>
    </div>

    <hr>

    <table class="tabla-clientes">
        <thead>
        <tr>
            <th>Código</th>
            <th>Username</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${listaUsuarios}">
            <td th:text="${user.codigo}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.rol}"></td>
            <td>
                <!-- CAMBIO 2: Solo el ADMIN puede ver los botones de Editar y Eliminar -->
                <div sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/usuarios/editar/{id}(id=${user.codigo})}" class="btn btn-editar">Editar</a>
                    <a th:href="@{/usuarios/eliminar/{id}(id=${user.codigo})}" class="btn btn-eliminar"
                       onclick="return confirm('¿Deseas eliminar este usuario?')">Eliminar</a>
                </div>
                <!-- El USER verá esto en lugar de los botones -->
                <span sec:authorize="hasRole('USER')" style="color: gray; font-style: italic;">Solo lectura</span>
            </td>
        </tr>
        </tbody>
    </table>

    <div style="text-align: center; margin-top: 20px;">
        <a th:href="@{/}" class="btn btn-editar">← Volver al Inicio</a>
    </div>
</div>
</body>
</html>
