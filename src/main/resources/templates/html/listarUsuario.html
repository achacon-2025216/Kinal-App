<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios - Kinal</title>
    <link rel="stylesheet" th:href="@{/css/listarUsuario.css}">
</head>
<body>

<div class="container">
    <h2>Gestión de Usuarios - Kinal</h2>

    <!-- BLOQUEO: Solo el ADMIN puede ver y usar el formulario -->
    <div class="card-formulario" sec:authorize="hasRole('ADMIN')">
        <!-- Verificamos si existe el código para cambiar el título -->
        <h3 th:text="${usuarioEditando.codigo != null} ? 'Editar Usuario' : 'Nuevo Usuario'"></h3>

        <form th:action="@{/usuarios/guardar}" th:object="${usuarioEditando}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>Código:</label>
                    <!-- El ID debe ser enviado, pero si es edición lo ponemos readonly -->
                    <input type="number" th:field="*{codigo}"
                           th:readonly="${usuarioEditando.codigo != null}"
                           class="form-control" required />
                </div>

                <div class="form-group">
                    <label>Username:</label>
                    <input type="text" th:field="*{username}" class="form-control" required />
                </div>

                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" th:field="*{email}" class="form-control" required />
                </div>

                <div class="form-group">
                    <label>Password:</label>
                    <!-- En edición, podrías dejar el password vacío o manejarlo en el service -->
                    <input type="password" th:field="*{password}" class="form-control"
                           th:required="${usuarioEditando.codigo == null}"
                           placeholder="Nueva contraseña o actual" />
                </div>

                <div class="form-group">
                    <label>Rol:</label>
                    <select th:field="*{rol}" class="form-control">
                        <option value="ADMIN">Administrador</option>
                        <option value="USER">Usuario</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Estado:</label>
                    <select th:field="*{estado}" class="form-control">
                        <option value="1">Activo</option>
                        <option value="0">Inactivo</option>
                    </select>
                </div>

                <div class="form-group" style="margin-top: 20px;">
                    <button type="submit" class="btn btn-nuevo">
                        <span th:text="${usuarioEditando.codigo != null} ? 'Actualizar' : 'Guardar'"></span>
                    </button>
                    <a th:if="${usuarioEditando.codigo != null}" th:href="@{/usuarios}" class="btn btn-eliminar">Cancelar</a>
                </div>
            </div>
            <hr>
            <div style="text-align: center;">
                <a th:href="@{/}" class="btn btn-editar">← Volver al Inicio</a>
            </div>
        </form>
    </div>

    <!-- Botón volver para USER -->
    <div style="margin-bottom: 20px;" sec:authorize="hasRole('USER')">
        <a th:href="@{/}" class="btn btn-editar">← Volver al Inicio</a>
    </div>

    <table class="tabla-clientes">
        <thead>
        <tr>
            <th>Código</th>
            <th>Username</th>
            <th>Email</th>
            <th>Rol</th>
            <th sec:authorize="hasRole('ADMIN')">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${listaUsuarios}">
            <td th:text="${user.codigo}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.rol}"></td>
            <td sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/usuarios/editar/{id}(id=${user.codigo})}" class="btn btn-editar">Editar</a>
                <a th:href="@{/usuarios/eliminar/{id}(id=${user.codigo})}" class="btn btn-eliminar"
                   onclick="return confirm('¿Deseas eliminar este usuario?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
